schema_version = "fidb-retention-policy/v1"
name = "nightly-safe-retention"

[paths]
runs = "artifacts/runs"
validation_runs = "artifacts/validation-runs"
failure_bundles = "artifacts/retention/failures"
plans = "var/fidb-retention/plans"
state = "var/fidb-retention/state.json"
memory_audits = "var/fidb-retention/memory-audits"
lane_import_receipts = "var/fidb-lanes/import-receipts"
holds = "retention/holds.toml"

[success]
# The queue-to-lane importer is not implemented yet. Until it emits a verified,
# relationship-complete receipt, the complete published attempt is evidence.
preserve_until_lane_imported = true
prune_after_receipt = ["work"]
required_result_artifacts = ["seal", "fidb", "fidbf"]

[failure]
retain_latest_evidence_bundle = true
collapse_identical_retries = true
evidence_globs = [
  "work/logs/**",
  "work/logs/**/*",
  "work/**/config.log",
  "work/**/CMakeError.log",
  "work/**/CMakeOutput.log",
  "work/**/meson-log.txt",
  "artifacts/libs/fidb_manifest.csv",
  "artifacts/cell-seal.json",
]
max_evidence_file_bytes = 67108864

[validation]
enabled = true
automatic_after_terminal_run = true
scratch_globs = ["worker-*"]
required_fold_artifacts = ["truth-map.json", "query-signatures.jsonl"]
# Validation composites are reconstruction scratch, not corpus evidence. They
# are eligible only after each fold seals digest-bound, relationship-complete
# function signatures. Legacy runs without this evidence remain protected.
prune_composite_binaries = true
required_signature_evidence_schema = "fidb-program-signature-evidence/v1"

[automation]
enabled = true
triggers = ["queue-drained", "machine-validation-complete"]
mode = "apply"
dry_run_first = true
maximum_estimated_seconds = 600
worker_action = "recycle"

[memory_cleanup]
enabled = true
audit_after_recycle = true
post_recycle_rss_warning_mib = 512
park_terminal_workers = true
park_poll_seconds = 10

[limits]
maximum_actions = 10000
maximum_scan_files = 2000000
