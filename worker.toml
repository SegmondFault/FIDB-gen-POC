schema_version = "fidb-worker/v3"
recipe_directory = "recipes"
requested_libraries = ["zlib", "bzip2"]

[[routes]]
id = "linux-x86_64-gnu-gcc"
target_os = "linux"
architecture = "x86_64"
binary_format = "ELF"
compiler_family = "gcc"
compiler = ["/usr/bin/gcc"]
archiver = ["/usr/bin/ar"]
ranlib = ["/usr/bin/ranlib"]
compiler_flags = ["-O2", "-fPIC", "-fno-lto", "-fno-omit-frame-pointer"]
object_file_markers = ["ELF", "x86-64", "relocatable"]
linked_suffix = ".so"
linked_file_markers = ["ELF", "x86-64", "shared object"]
ghidra_language = "x86:LE:64:default"
ghidra_compiler_spec = "gcc"
compiler_version_markers = ["Free Software Foundation"]

# Managed routes persist only stable authority IDs. Their executable paths and
# qualification digests are recovered from var/fidb-toolchains at load time.

[[routes]]
id = "linux-x86-64-gcc"
managed_toolchain_route = "linux-x86-64-gcc"
target_os = "linux"
architecture = "x86_64"
binary_format = "ELF"
compiler_family = "gcc"
compiler_flags = ["-O2", "-fPIC", "-fno-lto", "-fno-omit-frame-pointer"]
object_file_markers = ["ELF 64-bit LSB", "relocatable", "x86-64"]
linked_suffix = ".so"
linked_file_markers = ["ELF 64-bit LSB", "x86-64", "shared object"]
ghidra_language = "x86:LE:64:default"
ghidra_compiler_spec = "gcc"
compiler_version_markers = ["14.3.0", "Free Software Foundation"]

