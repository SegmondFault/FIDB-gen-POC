[[treatments]]
id = "baseline_o2"
factor = "baseline"
description = "O2, compiled without -g or LTO, frame pointer retained"
artifact_shape = "static-archive-members"
factor_values = { optimization-level = "O2", frame-pointer = "retained", stack-protection = "off" }
factor_variants = ["optimization:o2", "frame-pointer:retained", "stack-protection:off"]

[[treatments]]
id = "optimization_o0"
factor = "optimization-level"
description = "O0 control with baseline frame and stack policies"
remove_flags = ["-O2"]
append_flags = ["-O0"]
artifact_shape = "static-archive-members"
factor_values = { optimization-level = "O0", frame-pointer = "retained", stack-protection = "off" }
factor_variants = ["optimization:o0", "frame-pointer:retained", "stack-protection:off"]

[[treatments]]
id = "optimization_o3"
factor = "optimization-level"
description = "O3 optimization with baseline frame and stack policies"
remove_flags = ["-O2"]
append_flags = ["-O3"]
artifact_shape = "static-archive-members"
factor_values = { optimization-level = "O3", frame-pointer = "retained", stack-protection = "off" }
factor_variants = ["optimization:o3", "frame-pointer:retained", "stack-protection:off"]

[[treatments]]
id = "optimization_os"
factor = "optimization-level"
description = "Os size optimization with baseline frame and stack policies"
remove_flags = ["-O2"]
append_flags = ["-Os"]
artifact_shape = "static-archive-members"
factor_values = { optimization-level = "Os", frame-pointer = "retained", stack-protection = "off" }
factor_variants = ["optimization:os", "frame-pointer:retained", "stack-protection:off"]

[[treatments]]
id = "frame_pointer_omitted"
factor = "frame-pointer"
description = "O2 with frame pointer omission enabled"
remove_flags = ["-fno-omit-frame-pointer"]
append_flags = ["-fomit-frame-pointer"]
artifact_shape = "static-archive-members"
factor_values = { optimization-level = "O2", frame-pointer = "omitted", stack-protection = "off" }
factor_variants = ["optimization:o2", "frame-pointer:omitted", "stack-protection:off"]

[[treatments]]
id = "stack_protector_strong"
factor = "stack-protection"
description = "O2 with strong stack protection enabled"
remove_flags = ["-fno-stack-protector"]
append_flags = ["-fstack-protector-strong"]
artifact_shape = "static-archive-members"
factor_values = { optimization-level = "O2", frame-pointer = "retained", stack-protection = "strong" }
factor_variants = ["optimization:o2", "frame-pointer:retained", "stack-protection:strong"]

[profiles]
smoke = ["baseline_o2"]
c-route-toolchain-canary-v1 = ["baseline_o2", "optimization_o0", "optimization_o3", "optimization_os", "frame_pointer_omitted", "stack_protector_strong"]
