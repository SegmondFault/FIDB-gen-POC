schema_version = "fidb-worker/v3"
recipe_directory = "recipes"
requested_libraries = ["zlib", "bzip2"]

[[routes]]
id = "linux-x86_64-gnu-gcc"
target_os = "linux"
architecture = "x86_64"
binary_format = "ELF"
compiler = ["/usr/bin/gcc"]
archiver = ["/usr/bin/ar"]
ranlib = ["/usr/bin/ranlib"]
compiler_flags = ["-O2", "-fPIC", "-fno-lto", "-fno-omit-frame-pointer"]
object_file_markers = ["ELF", "x86-64", "relocatable"]
linked_suffix = ".so"
linked_file_markers = ["ELF", "x86-64", "shared object"]
ghidra_language = "x86:LE:64:default"
ghidra_compiler_spec = "gcc"
compiler_version_markers = ["Free Software Foundation"]

[[routes]]
id = "macos-arm64-apple-clang"
target_os = "macos"
architecture = "arm64"
binary_format = "Mach-O"
compiler = ["/usr/bin/xcrun", "--sdk", "macosx", "clang"]
archiver = ["/usr/bin/xcrun", "--sdk", "macosx", "ar"]
ranlib = ["/usr/bin/xcrun", "--sdk", "macosx", "ranlib"]
compiler_flags = ["-O2", "-fPIC", "-fno-lto", "-fno-omit-frame-pointer", "-arch", "arm64", "-mmacosx-version-min=11.0"]
object_file_markers = ["Mach-O", "arm64", "object"]
linked_suffix = ".dylib"
linked_file_markers = ["Mach-O", "arm64", "dynamically linked shared library"]
ghidra_language = "AARCH64:LE:64:v8A"
ghidra_compiler_spec = "default"
compiler_version_markers = ["Apple clang version"]

[[treatments]]
id = "baseline_o2"
factor = "baseline"
description = "O2, compiled without -g or LTO, frame pointer retained"

[profiles]
smoke = ["baseline_o2"]
