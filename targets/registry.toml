schema_version = "fidb-targets/v1"

# This catalogue records target coverage intent independently from installed
# toolchains.  A target may be reviewed through the Linux/ELF registry or only
# observed in the sensitivity study.  Runtime capability detection decides
# whether a reviewed route is installed or checksum-cached on a worker.

[[target]]
id = "linux-aarch64-elf"
label = "Linux AArch64"
platform = "linux"
architecture = "aarch64"
machine = "AArch64"
binary_format = "ELF"
endianness = "little"
bits = 64
catalog_state = "reviewed-abi"
evidence = ["toolchains/registry.toml"]

