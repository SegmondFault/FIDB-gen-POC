[project]
name = "fidb-poc"
version = "0.1.0"
description = "Small, inspectable Linux x86-64 GNU GCC Ghidra FIDB construction proof of concept"
requires-python = ">=3.10"
dependencies = ["pyghidra>=3.1.0,<4"]

[dependency-groups]
dev = ["black>=26.3.1"]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.10,<4"]

[project.scripts]
fidb-poc = "fidb_poc.cli:main"
fidb-language-probe = "fidb_poc.language_probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fidb_poc"]

[tool.black]
target-version = ["py310"]
