[project]
name = "fidb-poc"
version = "0.1.0"
description = "Inspectable, provenance-preserving system for building, validating and exporting Ghidra Function ID databases across C libraries, compiler generations, targets and ABIs"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyghidra>=3.1.0,<4",
    # Only used by scripts/drive_source_vm_build.py, run as a subprocess of
    # the same interpreter for the QEMU-isolated source-recipe build path.
    "pexpect>=4.9,<5",
]

[dependency-groups]
dev = ["black>=26.3.1"]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.10,<4"]

[project.scripts]
fidb-poc = "fidb_poc.cli:main"
fidb-language-probe = "fidb_poc.language_probe:main"
fidb-hunt = "fidb_poc.hunt_cli:main"

[project.optional-dependencies]
gpu = [
    "wgpu>=0.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fidb_poc"]

[tool.black]
target-version = ["py310"]
