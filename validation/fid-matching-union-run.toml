schema_version = "fidb-fid-matching-campaign/v1"
id = "c10-archive-linked-fid-methodology-v1"
state = "scheduled"
enabled = true
source_run_id = "c10-shared-image-symbolic-v2-full"
runtime = "validation/machine-validation-runtime.toml"
matching_authority = "validation/fid-matching.toml"
qualification_evidence = "validation/evidence/portable-fid-c10-canary-v1.json"
output_root = "artifacts/fid-matching-runs"

[reference]
population = "archive-plus-linked"

[[reference.component]]
id = "archive"
kind = "archive-evidence"
candidate_index = "artifacts/fid-matching-runs/c10-compact-fid-methodology-v2/compact-candidate-index.sqlite3"

[[reference.component]]
id = "linked"
kind = "linked-generation"
generation_seal = "artifacts/linked-reference-runs/c10-linked-reference-v1/generation-seal.json"
candidate_index = "artifacts/fid-matching-runs/c10-linked-fid-methodology-v1/compact-candidate-index-linked.sqlite3"

[methodology]
decision_unit = "query-function-library-owner"
candidate_semantics = "compact-portable-ghidra-fid-v1"
truth_precedence = ["linker-map", "unique-reference-name"]
unresolved_truth = "retain-exclude-from-confusion-matrix"
retain_hash_types = ["full", "specific", "complete"]
retain_oracle_inputs = "canary-only"
retain_backend_outputs = "canary-only"
retain_hash_observations = true
backend_contract = "selected-backend-no-fallback-canary"
required_link_harness = "whole-archive-shared-image-symbolic-v2"

[execution]
workers = 4
scheduling = "largest-query-first-greedy-v1"
engine = "compact-selected-backend-v1"
performance = "performance/fid-matching.toml"
compare_cpu_and_gpu = false
finish_started = true
resume_completed_cases = true

[canary]
cases = ["1:B", "67:B", "145:B", "175:B"]
workers = 1
oracle_replay_campaign_id = "c10-native-fid-methodology-v1"
minimum_truth_coverage = 0.80
require_zero_decision_mismatches = true
auto_chain_full = true

[safety]
execute_target_binaries = false
start_compilers = false
mutate_production_queue = false
require_no_active_production_jobs = true

[schedule]
timezone = "Europe/Luxembourg"

[[schedule.window]]
id = "normal-overnight"
kind = "weekly"
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
start = "00:00"
stop_admitting = "05:30"
enabled = true
