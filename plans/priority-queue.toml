# Reviewed activation of the first sealed priority chunk only.
# A passing full-path canary permits a separate transition to the complete
# 00:00-05:30 chaining queue; this authority cannot chain by itself.
schema_version = "fidb-queue/v1"
name = "c-malware-priority-native-v1-auto-30m-45m-canary-queue"

[queue]
armed = false
performance_profile = "reference-host-94g-balanced"
max_workers = 20
batch_order = ["c-malware-priority-native-v1-auto-30m-45m-chunk-001"]
poll_seconds = 5
lease_seconds = 3600
max_attempts = 3
retry_backoff_seconds = 30
retry_backoff_max_seconds = 900
authority_failure_threshold = 5

[schedule]
enabled = false
timezone = "Europe/Luxembourg"
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
start = "00:00"
stop_claiming = "05:30"
finish_started_batch = true
chain_batches = false

[resources]
min_available_memory_gib = 12
min_free_disk_gib = 200
max_load_per_cpu = 1.0
max_temperature_c = 90

[notifications]
events = ["job-failed", "job-requeued", "queue-drained", "resource-blocked", "schedule-cutoff"]
outbox = "var/fidb-notifications/c-malware-priority-native-v1.jsonl"
timeout_seconds = 10

[[batch]]
id = "c-malware-priority-native-v1-auto-30m-45m-chunk-001"
name = "boringssl · width chunk 001"
plan = "plans/auto-materialized/c-malware-priority-native-v1-auto-30m-45m/chunk-001.toml"
plan_sha256 = "4857eccf1812361d6f4a0529cfed5b8005b7bde38f90ac6e20e51c85a327b973"
queue_digest = "2873e8d0f4073d984184e0cba58330b34183575bb964db50e209d77c7ec1bed2"
executions = 36
