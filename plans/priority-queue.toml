schema_version = "fidb-queue/v1"
name = "library-priority"

[queue]
# Intent and priority live here.  The first native commissioning run completed
# and was drained on 2026-08-30; its batches are retired from this active queue
# while their plan files, artifacts, and durable ledger history remain intact.
# Block 01 was requeued through the evidence-preserving recovery transition
# after exact resolution preflight and four real SQLite/Readline canaries.
armed = true
# Bind queue concurrency to the measured 94 GiB policy used by the campaign
# time model. Queue loading fails closed if this cap drifts from the profile.
performance_profile = "reference-host-94g-balanced"
max_workers = 20
batch_order = [
  "c-top10-nonapple-width-v2-block-01",
  "c-top10-nonapple-width-v2-block-02",
  "c-top10-nonapple-width-v2-block-03",
  "c-top10-nonapple-width-v2-block-04",
  "c-top10-nonapple-width-v2-block-05",
]
poll_seconds = 5
lease_seconds = 3600
max_attempts = 3
# Retryable failures wait before they may be leased again.  The delay doubles
# per failed attempt and is capped, so a broken cell cannot spin overnight.
retry_backoff_seconds = 30
retry_backoff_max_seconds = 900
# Pause new claims after five terminal failures in the same authority class.
authority_failure_threshold = 5

[schedule]
enabled = true
timezone = "Europe/Luxembourg"
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
start = "01:00"
stop_claiming = "05:30"
# Admit at most one ordered batch in a schedule window. Once admitted, every
# worker may continue claiming that batch until it drains; no later batch is
# admitted during the same window. Omit hard_cutoff so work is never killed at
# 05:30. The resource gates below remain active while a batch drains.
finish_started_batch = true

[resources]
# Admission is checked immediately before every claim. Values describe the
# Linux resources visible to this worker pool, not nominal installed hardware.
min_available_memory_gib = 12
min_free_disk_gib = 200
max_load_per_cpu = 1.0
max_temperature_c = 90

[notifications]
events = [
  "job-failed",
  "job-requeued",
  "queue-drained",
  "resource-blocked",
  "schedule-cutoff",
]
outbox = "var/fidb-notifications/events.jsonl"
# Optional delivery is enabled only when this named variable contains an HTTPS
# endpoint. The outbox remains the durable local notification record.
webhook_url_env = "FIDB_NOTIFICATION_WEBHOOK_URL"
webhook_bearer_env = "FIDB_NOTIFICATION_BEARER_TOKEN"
timeout_seconds = 10

# These five blocks are materialized and ordered, but the queue remains
# disarmed above. File hashes protect the generated TOML and queue digests
# protect the exact ordered cell identities after host-local route resolution.

[[batch]]
id = "c-top10-nonapple-width-v2-block-01"
name = "C top ten width v2 · SQLite + Readline"
plan = "plans/materialized/c-top10-nonapple-width-v2/block-01.toml"
