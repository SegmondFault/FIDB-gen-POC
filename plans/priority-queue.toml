schema_version = "fidb-queue/v1"
name = "library-priority"

[queue]
# Intent and priority live here.  The first native commissioning run completed
# and was drained on 2026-08-30.  A future run must be deliberately re-armed,
# synchronized and inspected before any worker is started.
armed = false
# Initial host-safe cap. Raise only after the ledger has real Ghidra RSS and
# stage-duration evidence; worker service instances above this remain idle.
max_workers = 2
batch_order = [
  "batch-000",
  "batch-005",
]
poll_seconds = 5
lease_seconds = 3600
max_attempts = 3
# Retryable failures wait before they may be leased again.  The delay doubles
# per failed attempt and is capped, so a broken cell cannot spin overnight.
retry_backoff_seconds = 30
retry_backoff_max_seconds = 900

[schedule]
enabled = true
timezone = "Europe/Luxembourg"
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
start = "22:00"
stop_claiming = "05:45"
hard_cutoff = "06:15"

[resources]
# Admission is checked immediately before every claim. Values describe the
# Linux resources visible to this worker pool, not nominal installed hardware.
min_available_memory_gib = 12
min_free_disk_gib = 200
max_load_per_cpu = 1.0
max_temperature_c = 90

[notifications]
events = [
  "job-failed",
  "job-requeued",
  "queue-drained",
  "resource-blocked",
  "schedule-cutoff",
]
outbox = "var/fidb-notifications/events.jsonl"
# Optional delivery is enabled only when this named variable contains an HTTPS
# endpoint. The outbox remains the durable local notification record.
webhook_url_env = "FIDB_NOTIFICATION_WEBHOOK_URL"
webhook_bearer_env = "FIDB_NOTIFICATION_BEARER_TOKEN"
timeout_seconds = 10

[[batch]]
id = "batch-000"
name = "tier-0-runtime-foundations"
plan = "plans/tier0-runtime-foundations.toml"
# First overnight commissioning is native-only.  The reviewed PowerPC source
# matrix remains in the plan but is not materialized by this queue until its
# pinned acquisition/local cross-build path has a separate foreground canary.
matrices = ["tier0-zlib-native"]

[[batch]]
id = "batch-005"
name = "bzip2-native-baseline"
plan = "plans/bzip2-native.toml"
