schema_version = "fidb-plan/v1"
name = "c-failure-recovery-2026-09-04"

[policy]
max_cells = 6
priority = "high"

[coverage]
factor_variants = []

[queue]
strategy = "recipe-then-variant"
recipe_order = [
  "zstd@1.5.7",
  "nghttp2@1.70.0",
  "openssl@3.5.8",
  "gmp@6.3.0",
  "gettext@1.0",
  "pcre2@10.48",
]

[[matrix]]
id = "zstd-safe-symlink"
kind = "width-native"
width_batch = "batches/c-next-nine-mega-width.toml"
recipes = ["zstd@1.5.7"]
routes = ["linux-x86-64-gcc-12"]
treatments = ["baseline_o2"]

[[matrix]]
id = "nghttp2-release-timestamps"
kind = "width-native"
width_batch = "batches/c-next-nine-mega-width.toml"
recipes = ["nghttp2@1.70.0"]
routes = ["linux-x86-64-gcc-12"]
treatments = ["baseline_o2"]

[[matrix]]
id = "openssl-wide-manifest"
kind = "width-native"
width_batch = "batches/c-openssl-android-gap.toml"
recipes = ["openssl@3.5.8"]
routes = ["android-arm64-ndk-r27d-clang-api21"]
treatments = ["baseline_o2"]

[[matrix]]
id = "gmp-host-generator"
kind = "width-native"
width_batch = "batches/c-next-nine-mega-width.toml"
recipes = ["gmp@6.3.0"]
routes = ["windows-x86-64-llvm-mingw-clang-15"]
treatments = ["baseline_o2"]

[[matrix]]
id = "gettext-short-windows-path"
kind = "width-native"
width_batch = "batches/c-next-nine-mega-width.toml"
recipes = ["gettext@1.0"]
routes = ["windows-x86-64-llvm-mingw-clang-15"]
treatments = ["frame_pointer_omitted"]

[[matrix]]
id = "pcre2-coff-header"
kind = "width-native"
width_batch = "batches/c-next-nine-mega-width.toml"
recipes = ["pcre2@10.48"]
routes = ["windows-x86-64-llvm-mingw-clang-20"]
treatments = ["optimization_o0"]
