# Reviewed recovery authority. Keep disarmed in Git until preflight passes.
schema_version = "fidb-plan/v1"
name = "c-openssl-fidbf-recovery"

[policy]
max_cells = 174
priority = "high"

[coverage]
factor_variants = []

[queue]
strategy = "recipe-then-variant"
recipe_order = ["openssl@3.5.8"]

[[matrix]]
id = "openssl-nonandroid-fidbf-recovery"
kind = "width-native"
width_batch = "batches/c-openssl-fidbf-recovery.toml"
recipes = ["openssl@3.5.8"]
routes = [
  "linux-x86-64-gcc-12",
  "linux-x86-64-gcc-13",
  "linux-x86-64-gcc",
  "linux-arm32-gcc-12",
  "linux-arm32-gcc-13",
  "linux-arm32-gcc",
  "linux-aarch64-gcc-12",
  "linux-aarch64-gcc-13",
  "linux-aarch64-gcc",
  "linux-mips32-be-gcc-12",
  "linux-mips32-be-gcc-13",
  "linux-mips32-be-gcc",
  "linux-mips32-le-gcc-12",
  "linux-mips32-le-gcc-13",
  "linux-mips32-le-gcc",
  "linux-powerpc32-be-gcc-12",
  "linux-powerpc32-be-gcc-13",
  "linux-powerpc32-be-gcc",
  "linux-sh32-gcc-12",
  "linux-sh32-gcc-13",
  "linux-sh32-gcc",
  "linux-m68k-gcc-12",
  "linux-m68k-gcc-13",
  "linux-m68k-gcc",
  "windows-x86-64-llvm-mingw-clang-15",
  "windows-x86-64-llvm-mingw-clang-17",
  "windows-x86-64-llvm-mingw-clang-19",
  "windows-x86-64-llvm-mingw-clang-20",
  "windows-x86-64-llvm-mingw",
]
treatments = [
  "baseline_o2",
  "optimization_o0",
  "optimization_o3",
  "optimization_os",
  "frame_pointer_omitted",
  "stack_protector_strong",
]
