lock_path = "sources/locks/c80-four-source-n80-v1.toml"
max_metadata_bytes = 134217728
max_archive_bytes = 4294967296
download_workers = 8

[[resolver]]
id = "homebrew"
kind = "homebrew-formula-json"
priority = 10
url = "https://formulae.brew.sh/api/formula.json"

[[resolver]]
id = "debian-sid"
kind = "debian-sources-xz"
priority = 20
url = "https://deb.debian.org/debian/dists/sid/main/source/Sources.xz"

[[alias]]
resolver_id = "debian-sid"
candidate_key = "xorg-macros"
registry_key = "xutils-dev"
reason = "Debian ships the X.Org autoconf macros from the xutils-dev source package."

[[alias]]
resolver_id = "debian-sid"
candidate_key = "stb"
registry_key = "libstb"
reason = "Debian's source package for the upstream stb headers is named libstb."

[[preference]]
candidate_key = "maven"
resolver_id = "debian-sid"
reason = "Homebrew's Maven formula points to a prebuilt binary distribution; acquisition requires the Debian source archive instead."

[[rewrite]]
id = "gnu-primary"
resolver_id = "homebrew"
match_prefix = "https://ftpmirror.gnu.org/gnu/"
replacement_prefix = "https://ftp.gnu.org/gnu/"
reason = "Use GNU's deterministic primary archive host instead of its dynamic mirror redirector."

[[rewrite]]
id = "savannah-mirror"
resolver_id = "homebrew"
match_prefix = "https://download.savannah.nongnu.org/releases/"
replacement_prefix = "https://download-mirror.savannah.nongnu.org/releases/"
reason = "Use Savannah's direct mirror endpoint because the load-balanced endpoint is unreachable from the acquisition host."

[[rewrite]]
id = "apache-dlcdn"
resolver_id = "homebrew"
match_prefix = "https://www.apache.org/dyn/closer.lua?path="
replacement_prefix = "https://dlcdn.apache.org/"
reason = "Use Apache's direct content endpoint; closer.lua returns an HTML mirror-selection page to generic clients."

[[unresolved]]
candidate_key = "opengl"
classification = "virtual-system-interface"
reason = "OpenGL names an API and loader contract, not one canonical source release; implementation selection belongs to candidate screening."
