[package]
name = "fidb-rust-staged"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
