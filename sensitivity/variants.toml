schema_version = "fidb-factor-variants/v1"

# These are named coverage choices, not compiler flags.  A registered choice
# maps to an existing reviewed treatment or fixed route value.  Other choices
# remain selectable planning targets until their recipe/toolchain/treatment
# support is reviewed and added.

