schema_version = "fidb-lanes/v1"

# This is an experimental, reversible authority. A lane is the database a user
# selects for a device/platform family. A sublane is the exact query and
# semantic-deduplication namespace selected from the binary and Ghidra program.

[[policy]]
id = "ghidra-fid-12-1-2-dev-default-v1"
ghidra_version = "12.1.2"
ghidra_release = "DEV"
ghidra_build = "2026-Jun-29 1514 GMT"
analysis_profile = "FIDB PoC default auto-analysis and Function ID population policy"
fid_algorithm = "Ghidra Function ID full and specific hashes"

[[lane]]
id = "linux-x86"
label = "Linux x86"
platform = "linux"
architecture_family = "x86"
state = "experimental"
description = "One analyst database for 32-bit and 64-bit Linux x86 executables."

[[lane.sublane]]
id = "linux-x86-elf32"
target_id = "linux-x86-32-elf"
policy_id = "ghidra-fid-12-1-2-dev-default-v1"
definition_state = "mapped"
ghidra_language_ids = ["x86:LE:32:default"]
compiler_spec_ids = ["gcc"]

[[lane.sublane]]
id = "linux-x86-elf64"
target_id = "linux-x86-64-elf"
