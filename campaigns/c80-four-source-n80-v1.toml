[pipeline]
stages = [
  "candidate-screen",
  "source-pin-cache",
  "recipe-author",
  "recipe-qualification",
  "qualification-seal",
  "time-model",
  "queue-candidate",
  "full-path-canary",
  "campaign-execution",
  "machine-validation",
  "retention",
]
screening_policy = "Screen in popularity order. Exclusions retain their reason and are replenished from the next research rank before a cohort is frozen."
source_policy = "Pin one exact stable release and source archive only after the candidate is accepted as an in-scope reusable C-family subject."
recipe_policy = "Author and review a command-free fixed adapter plus dependency pins; source presence alone never means recipe-ready."
qualification_policy = "Compile every accepted recipe at the target-family and oldest compiler-generation edge set; a current digest-bound seal is mandatory."
queue_policy = "A sealed cohort may generate time-bounded chained queue chunks. Promotion produces a queue-eligible but disarmed candidate."
canary_policy = "Exercise compilation, object validation, Ghidra analysis and publication before any campaign queue is armed."
validation_policy = "Schedule deterministic single-hash machine validation after each ten newly completed accepted families; the final partial cohort requires an explicit TOML override."
retention_policy = "Run dry-run-first retention and worker memory cleanup after every terminal execution or validation session."

