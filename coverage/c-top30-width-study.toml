schema_version = "fidb-width-study/v1"
id = "study-c30"
name = "c-top30-width-study"
label = "C top 30 · width study"
language_id = "c"
state = "defined-disarmed"
selection_status = "provisional-c-screened-ranks-1-30"
family_count = 30
default_preset = "campaign-b-18"
purpose = "Hold the C family count at thirty while release, route, compiler/treatment, artifact, analysis, admission and replay width are measured before scaling to the wider catalogue."
ranking_authority = "mapping-the-tail/reports/library_popularity_tiers_v0.csv"
ranking_snapshot = "C-screened two-source priority table; ranks 1-30"
queue_policy = "Coverage intent only. Materialize a fidb-plan/v1 request and add it to plans/priority-queue.toml only after exact recipes, releases, route profiles and treatment mappings resolve."
caveat = "This is the agreed provisional C-only top thirty, not a completed four-source native-C eligibility screen. Width estimates are declared experimental denominators, not queued work or admitted coverage."

[scaling]
comparison_family_counts = [10, 20, 30, 40, 80]
default_target_families = 80
default_workers = 2
maximum_workers = 4
model = "ideal occupied worker slots; queue, failures, setup and route unavailability excluded"

[calibration]
evidence_class = "measured"
sample_count = 2
successful_wall_ns_min = 11179018021
successful_wall_ns_p50 = 11182015389
successful_wall_ns_max = 11185012758
retained_bundle_bytes_p50 = 31265942
compact_output_bytes_p50 = 247481
peak_worker_rss_bytes_p50 = 1554034688
scratch_peak_state = "not-measured"
basis = "Completed native zlib 1.3.1 and bzip2 1.0.7 linux-x86_64 GCC O2 commissioning attempts in the durable ledger; retained bundle bytes re-read from their published attempt roots."
caveat = "Two small libraries on one route are a smoke anchor, not a top-ten forecast. Complexity and retained-byte multipliers remain planning assumptions until this batch supplies a distribution."

# Ordered primary route/toolchain requirements make a numeric route width
# actionable.  Exact versions and digests still belong in worker.toml or the
# toolchain registry before any row becomes installable or executable.

[[toolchain_requirement]]
order = 1
id = "linux-x86-64-gcc"
target_id = "linux-x86-64-elf"
compiler_family = "gcc"
wave = "campaign-b-core"
worker_class = "linux-local"
acquisition = "host-installed"
version_policy = "Pin current GCC and an adjacent release as separate build profiles."
rationale = "Commissioned native factory route and local throughput anchor."

