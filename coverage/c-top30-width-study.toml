# The first four axes multiply separately compiled/artifact build cells.
# Analysis profiles reuse those build artifacts, admission policies reuse the
# resulting FID evidence, and replay repeats the full producer/analysis path.

[[axis]]
id = "releases"
label = "Pinned source releases"
layer = "build-cell"
minimum = 1
default = 2
maximum = 3
unit = "releases per family"
description = "Current, previous and optionally one older retained source release."

[[axis]]
id = "routes"
label = "Eligible hard routes"
layer = "build-cell"
minimum = 1
default = 3
maximum = 20
unit = "route profiles per release"
description = "Architecture × format × OS/ABI/runtime routes; inapplicable combinations remain explicit."

[[axis]]
id = "build_profiles"
label = "Compiler / treatment profiles"
layer = "build-cell"
minimum = 1
default = 3
maximum = 20
unit = "route-specific profiles"
description = "Finite compiler family/version and code-generation tuples, never a blind flag Cartesian product."

[[axis]]
id = "artifact_shapes"
label = "Artifact shapes"
layer = "build-cell"
minimum = 1
default = 1
maximum = 4
unit = "archive/link shapes"
description = "Static archive, reviewed linked output and other explicitly attributable packaging shapes."

[[axis]]
id = "analysis_profiles"
label = "Analysis / recovery profiles"
layer = "analysis-reuse"
minimum = 1
default = 1
maximum = 6
unit = "analyses per build artifact"
description = "Route-selected and guarded recovery profiles reuse compiled artifacts but create separate analysis evidence."

[[axis]]
id = "admission_profiles"
label = "Admission / matching policies"
layer = "policy-reuse"
minimum = 1
default = 1
maximum = 3
unit = "policy evaluations per analysis"
description = "Versioned matching and admission comparisons reuse FID evidence and do not trigger recompilation."

[[axis]]
id = "replay"
label = "Independent replay"
layer = "repeat"
minimum = 1
default = 2
maximum = 3
unit = "producer/analysis attempts"
description = "Clean repeated execution used to measure reproducibility and factory variance."

