schema_version = "fidb-coverage-universe/v2"

[population]
published_four_source_n80_families = 276
tier_zero_families = 7
published_priority_head_families = 283
nine_source_candidate_spine_keys = 25019
nine_source_shared_frontier_keys = 7801
nine_source_n80_candidate_rank = 1005
global_family_lower_estimate = 800000
global_family_central_estimate = 1400000
global_family_upper_estimate = 2500000
population_caveat = "The four-source 276-family N80 and its 283-family Tier-0 campaign total are a published priority-head proxy, not global C80. The nine-source 1,005 value is an N80 rank cutoff inside a 7,801-key shared frontier and still requires canonical-family, reusable-native and C-language screening. The 0.8-2.5 million global range is provisional."

[[dimension]]
id = "library-source"
label = "Library & source identity"
layer = "subject"
description = "Which reusable code family and exact source bytes are being represented."
matrix_role = "multiplier"
facets = ["canonical family", "source release", "exact bytes or revision", "build adapter", "static/shared shape", "library component"]
factor_ids = ["source-release", "source-archive", "build-system", "archive-member-shape"]

[[dimension]]
id = "target-route"
label = "Target, ISA & ABI"
layer = "build"
description = "Where the code is meant to execute and the binary contract emitted by the toolchain."
matrix_role = "applicability"
facets = ["platform", "object format", "ISA", "word size", "endianness", "OS ABI", "runtime or sysroot", "calling convention"]
factor_ids = ["architecture", "binary-format", "endianness", "word-size", "abi"]

[[dimension]]
id = "compiler-toolchain"
label = "Compiler & toolchain"
layer = "build"
description = "Compiler family and pinned toolchain identity, including the other binary-producing tools."
matrix_role = "multiplier"
facets = ["compiler family", "exact and adjacent version", "compiler runtime", "assembler", "linker", "archiver", "SDK or sysroot", "CPU target"]
factor_ids = ["compiler-family", "compiler-version", "cpu-tuning"]

[[dimension]]
id = "compile-treatment"
label = "Compile treatment"
layer = "build"
description = "A bounded set of code-generation changes, sampled as named profiles rather than a blind Cartesian product."
matrix_role = "bounded-profile"
facets = ["optimization", "frame pointer", "stack protector", "LTO", "sanitizer", "PAC/BTI", "PIC", "debug information", "dead-code policy"]
factor_ids = ["optimization", "frame-pointer", "stack-protector", "lto", "sanitizer", "pac-bti", "pic", "debug-info", "dead-code-elimination"]

[[dimension]]
id = "artifact-analysis"
label = "Artifact & analysis"
layer = "analysis"
description = "How one compile artifact is packaged and interpreted; analysis profiles can reuse a build."
matrix_role = "analysis-reuse"
facets = ["archive or linked shape", "stripping", "symbol availability", "Ghidra language", "compiler specification", "Ghidra version", "recovery profile"]
factor_ids = ["strip", "analysis-tool-version", "analysis-language", "analysis-recovery"]

[[dimension]]
id = "matching-admission"
label = "Matching & admission"
layer = "truth"
description = "FID database construction, match thresholds, collision handling, and evidence admission policy."
matrix_role = "policy-control"
facets = ["FID database set", "minimum function size", "parent/child relationships", "score thresholds", "collision policy", "owner identity", "admission decision"]
factor_ids = ["fid-database-set", "minimum-function-size", "matching-threshold", "collision-policy", "truth-admission"]

[[dimension]]
id = "evidence-operations"
label = "Evidence & operations"
layer = "operations"
description = "What makes a result reproducible, comparable, schedulable, and retainable at scale."
matrix_role = "policy-control"
facets = ["build repeat", "analysis repeat", "source and tool digests", "worker environment", "replay", "resource envelope", "storage", "retention"]
factor_ids = ["provenance", "repeatability", "worker-environment", "resource-policy"]

# One shared census and route/admission model feeds language-owned build
# policies.  Only C is an active executable programme scope today; the other
# rows make their distinct denominators and treatment axes visible without
# inventing family counts or executable coverage.

[[language]]
id = "c"
label = "C"
state = "active-scope"
scope = "Reusable native C library components; C++-only libraries and language bindings are excluded from this denominator."
denominator = "Canonical reusable native C library families × every eligible or unresolved hard route whose route-specific C treatment profile must be complete."
treatment_axes = ["compiler family and exact/adjacent version", "O0/O1/O2/O3/Os/Oz optimisation", "PIC and link shape", "LTO", "frame-pointer policy", "CPU target", "stack protection", "sanitizers", "PAC/BTI where applicable", "debug and symbol state"]
toolchain_family_ids = ["gcc", "llvm-clang", "apple-clang", "msvc", "mingw-gcc", "zig-clang"]
caveat = "The native-C eligibility screen and frozen global route census are not complete; popularity N80 is only a priority head."
authority = "mapping-the-tail/MAPPING_CONTRACT.md + FIDB sensitivity study"

[[language]]
id = "cpp"
label = "C++"
state = "designed"
scope = "Reusable native C++ components, including mixed C/C++ outputs when C++ ABI-bearing code is emitted."
denominator = "Canonical native C++ families/components × eligible or unresolved hard routes × the approved C++ ABI and treatment policy."
treatment_axes = ["compiler family and version", "language dialect", "standard library and ABI", "exceptions", "RTTI", "optimisation", "LTO", "visibility and symbol state", "sanitizers", "CPU target"]
toolchain_family_ids = ["gcc", "llvm-clang", "apple-clang", "msvc", "mingw-gcc", "zig-clang"]
caveat = "C++ must not inherit the C profile count: standard-library, dialect and ABI choices create additional route-local cells."
authority = "mapping-the-tail/MAPPING_CONTRACT.md"

[[language]]
id = "rust"
label = "Rust"
state = "designed"
scope = "Rust crates that contribute reusable native machine-code functions on an eligible route."
denominator = "Canonical native-eligible Rust families/components × eligible or unresolved hard routes × approved rustc treatment profiles."
treatment_axes = ["rustc version and channel", "opt-level", "LTO", "codegen units", "panic strategy", "target features", "linker and runtime", "debug and strip state"]
toolchain_family_ids = ["rustc"]
caveat = "No screened Rust family denominator or executable FID profile pack is registered yet."
authority = "mapping-the-tail/MAPPING_CONTRACT.md"

[[language]]
id = "go"
label = "Go"
state = "designed"
scope = "Go modules or components that contribute reusable native machine-code functions, with CGO state explicit."
denominator = "Canonical native-eligible Go families/components × eligible or unresolved hard routes × approved Go treatment profiles."
treatment_axes = ["Go toolchain version", "optimisation/debug controls", "build tags", "CGO", "internal/external link mode", "trimpath and symbol state", "target features"]
toolchain_family_ids = ["go-toolchain"]
caveat = "No screened Go family denominator or executable FID profile pack is registered yet."
authority = "mapping-the-tail/MAPPING_CONTRACT.md"

[[language]]
id = "swift"
label = "Swift"
state = "designed"
scope = "Swift packages and components emitting reusable native machine code."
denominator = "Canonical native-eligible Swift families/components × eligible or unresolved Apple/runtime routes × approved Swift treatment profiles."
treatment_axes = ["Swift compiler version", "Onone/O/Osize", "whole-module optimisation", "SDK and deployment target", "runtime identity", "library evolution mode", "debug and strip state"]
toolchain_family_ids = ["swiftc"]
caveat = "No screened Swift family denominator or executable FID profile pack is registered yet."
authority = "mapping-the-tail/MAPPING_CONTRACT.md"

[[language]]
id = "other"
label = "Other native"
state = "vocabulary-only"
scope = "Zig, Fortran, Ada, D, Nim, Pascal, assembly, and native Python, Node, Ruby or JNI extension components."
denominator = "A separately frozen canonical family/component census and reviewed finite treatment policy for each language or extension ABI."
treatment_axes = ["language/compiler version", "language-specific optimisation", "runtime and extension ABI", "linker and object format", "target features", "symbol state"]
toolchain_family_ids = ["gcc", "llvm-clang", "zig-clang"]
caveat = "Vocabulary coverage records discoverability only; it does not assert that these matrices or build routes are implemented."
authority = "mapping-the-tail/MAPPING_CONTRACT.md"

[[compiler_family]]
id = "gcc"
label = "GCC"
route_scope = "GNU/Linux, ELF cross targets, and compatible embedded runtimes"
state = "catalogued"
language_ids = ["c", "cpp", "other"]
version_strategy = "Pin an exact current release and one adjacent/previous release per supported route."
settings = ["O0", "O2", "O3", "Os", "frame-pointer", "stack-protector-strong", "CPU tuning", "guarded LTO"]

[[compiler_family]]
id = "llvm-clang"
label = "Clang / LLVM"
route_scope = "ELF and Android routes where a reviewed sysroot exists"
state = "desired"
language_ids = ["c", "cpp", "other"]
version_strategy = "Pin current and adjacent LLVM releases; pair with exact linker and runtime identities."
settings = ["O0", "O2", "O3", "Oz", "frame-pointer", "stack protection", "CPU tuning", "guarded LTO"]

[[compiler_family]]
