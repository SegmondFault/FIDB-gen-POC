label = "Apple Clang"
route_scope = "Mach-O macOS routes with a pinned SDK"
state = "study-observed"
language_ids = ["c", "cpp"]
version_strategy = "Treat Xcode, Apple Clang, SDK, and deployment target as one pinned route identity."
settings = ["O0", "O2", "O3", "Os", "dead stripping", "deployment target", "guarded LTO"]

[[compiler_family]]
