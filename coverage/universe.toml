[[compiler_family]]
id = "rustc"
label = "rustc"
route_scope = "Rust target triples with pinned rustc, LLVM backend, linker, runtime and target features"
state = "desired"
language_ids = ["rust"]
version_strategy = "Pin rustc release/channel, target specification, LLVM backend and linker/runtime identity."
settings = ["opt-level", "LTO", "codegen units", "panic strategy", "target features", "debug/strip"]

[[compiler_family]]
