schema_version = "fidb-toolchain-routes/v1"

# A route is a target/compiler composition.  Downloadable routes reference
# immutable packs; external-worker routes remain part of the same profile so
# host constraints cannot disappear from the planning denominator.

[[route]]
id = "linux-x86-64-gcc"
label = "Linux x86-64 · GCC 14.3"
target_id = "linux-x86-64-elf"
compiler_family = "gcc"
provisioning = "downloadable-pack"
pack_ids = ["bootlin-x86-64-glibc-stable-2025.08-1"]
worker_class = "linux-x86_64"
qualification_state = "acquisition-reviewed"

[[route]]
id = "macos-arm64-apple-clang"
label = "macOS ARM64 · Apple Clang"
target_id = "macos-arm64-macho"
compiler_family = "apple-clang"
provisioning = "external-worker"
pack_ids = []
worker_class = "macos-native-remote"
qualification_state = "external-definition-required"
external_requirements = ["Xcode build", "Apple Clang build", "macOS SDK", "deployment target"]

