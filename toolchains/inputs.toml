schema_version = "fidb-toolchain-inputs/v1"

# Inputs are required toolchain components that this project cannot lawfully or
# reliably redistribute.  They stay in the same declarative authority chain so
# an operator or LLM can report the gap without inventing a download.

[[input]]
id = "apple-macos-sdk"
label = "Apple macOS SDK"
kind = "user-supplied-sdk"
target_ids = ["macos-arm64-macho"]
source_policy = "Obtain from licensed Xcode or Apple Command Line Tools; the project does not redistribute Apple SDK payloads."
required_metadata = ["xcode_version", "sdk_version", "deployment_target", "sha256", "bytes"]
state = "operator-supplied-unbound"
authority = "https://github.com/tpoechtrager/osxcross/blob/master/README.SDK.md"
